name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@v6
      - name: Verify electronic corpus generation
        run: |
          uv sync --locked --project tools/songci
          uv run --locked --project tools/songci tools/songci/import_songci.py --check
          uv run --locked --project tools/songci python -m unittest discover -s tools/songci
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Validate full corpus
        run: go run ./cmd/corpuscheck

  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build static Linux amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_SHA}" -o dist/curated-poetry-api ./cmd/server
      - name: Record SHA-256
        working-directory: dist
        run: sha256sum curated-poetry-api > curated-poetry-api.sha256
      - name: Include license and source notices
        run: cp LICENSE DATA_LICENSE NOTICE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: curated-poetry-api-linux-amd64
          path: dist/
          if-no-files-found: error

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@v6
      - name: Verify electronic corpus generation
        run: |
          uv sync --locked --project tools/songci
          uv run --locked --project tools/songci tools/songci/import_songci.py --check
          uv run --locked --project tools/songci python -m unittest discover -s tools/songci
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Validate full corpus
        run: go run ./cmd/corpuscheck
      - name: Build static Linux amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/curated-poetry-api ./cmd/server
      - name: Record SHA-256 and notices
        run: |
          cd dist
          sha256sum curated-poetry-api > curated-poetry-api.sha256
          cp ../LICENSE ../DATA_LICENSE ../NOTICE .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/curated-poetry-api
          dist/curated-poetry-api.sha256
          dist/LICENSE
          dist/DATA_LICENSE
          dist/NOTICE
          --title "${GITHUB_REF_NAME}"
          --generate-notes
